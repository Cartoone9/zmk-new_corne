draw_config:
  n_columns: 1
  draw_key_sides: true
  key_w: 60.0
  key_h: 56.0
  split_gap: 30.0
  combo_w: 34.0
  combo_h: 24.0
  key_rx: 6.0
  key_ry: 6.0
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 40.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: false
  small_pad: 2.0
  shrink_wide_legends: 7
  glyph_tap_size: 18
  glyph_hold_size: 13
  glyph_shifted_size: 13
  svg_extra_style: |
    svg.keymap {
      font-family: Ubuntu Mono, Inconsolata, Consolas, Liberation Mono, Menlo, monospace;
      font-size: 12px;
      font-weight: bold;
      text-rendering: optimizeLegibility;
    }
    /* Layer titles */
    text.label {
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    /* One title color per group: typing / windows / numbers / board */
    #BASE, #CODE, #EXTRA { fill: #2d3748; }
    #NAV, #MOV_WIN { fill: #1f7a6d; }
    #NUM, #FN { fill: #6b46c1; }
    #BOARD { fill: #c05621; }
    /* Keys held to reach the layer */
    rect.held, rect.combo.held {
      fill: #ffd966;
    }
    /* Empty and pass-through keys stay quiet */
    rect.none, rect.trans {
      fill: #fbfbfb;
    }
    rect.side.none, rect.side.trans {
      fill: #efefef;
    }
    text.trans {
      fill: #c8c8c8;
    }
    /* Hold legend (layer names) */
    text.hold {
      fill: #2b6cb0;
    }
    /* Shift legend (Shift + key) */
    text.shifted {
      fill: #b7472a;
    }
    /* Combos */
    rect.combo {
      fill: #dbe9f7;
    }
    /* Joystick and other positions that have no physical key (ghost keys, see draw.yml) */
    g.ghost {
      display: none;
    }
  glyph_urls:
    mdi: https://raw.githubusercontent.com/Templarian/MaterialDesign-SVG/master/svg/{}.svg
  use_local_cache: true

parse_config:
  mark_alternate_layer_activators: true
  sticky_label: sticky
  trans_legend:
    t: ▽
    type: trans

  modifier_fn_map:
    left_ctrl: Ctrl
    right_ctrl: Ctrl
    left_shift: Shift
    right_shift: Shift
    left_alt: Alt
    right_alt: AltGr
    left_gui: Super
    right_gui: Super
    keycode_combiner: "{mods}+{key}"
    mod_combiner: "{mod_1}+{mod_2}"

  # Labels by full binding (layer names are expanded to numbers:
  # 0 BASE, 1 CODE, 2 EXTRA, 3 NAV, 4 MOV_WIN, 5 NUM, 6 FN, 7 BOARD)
  raw_binding_map:
    "&none": {t: "", type: none}

    # BASE
    "&kp LA(SPACE)": Launcher
    "&shift_caps": {t: Shift, s: "2× Caps"}
    # Tap part of the Backspace/CODE thumb (layer-tap entries must stay unmapped,
    # or keymap-drawer stops marking the held thumbs on CODE/EXTRA/NAV)
    "&bspc_word": {t: "$$mdi:backspace-outline$$", s: "word ⌫", type: backspace}

    # EXTRA
    "&kp C_BRI_DN": "Bright −"
    "&kp C_BRI_UP": "Bright +"
    "&kp K_LOCK": Lock
    "&kp PSCRN": PrtSc
    # F18-F22 exist in the firmware for future use, but are not drawn
    "&kp F18": {t: "", type: none}
    "&kp F19": {t: "", type: none}
    "&kp F20": {t: "", type: none}
    "&kp F21": {t: "", type: none}
    "&kp F22": {t: "", type: none}

    # NAV (both thumbs)
    "&kp LA(N1)": WS 1
    "&kp LA(N2)": WS 2
    "&kp LA(N3)": WS 3
    "&kp LA(N4)": WS 4
    "&kp LA(LS(N1))": "Send 1"
    "&kp LA(LS(N2))": "Send 2"
    "&kp LA(LS(N3))": "Send 3"
    "&kp LA(LS(N4))": "Send 4"
    "&kp LA(S)": "WS tmp"
    "&kp LA(LS(S))": "Send tmp"
    "&kp LA(W)": Close
    "&kp LA(Q)": Quit
    "&kp LA(N)": New window
    "&kp LA(F)": Focus full
    "&kp LS(TAB)": "⇤ Tab"

    # MOV_WIN (C+V)
    "&kp LG(LEFT)": "Move ←"
    "&kp LG(DOWN)": "Move ↓"
    "&kp LG(UP)": "Move ↑"
    "&kp LG(RIGHT)": "Move →"
    "&kp LG(U)": "Move ↖"
    "&kp LG(I)": "Move ↗"
    "&kp LG(J)": "Move ↙"
    "&kp LG(K)": "Move ↘"
    "&kp LG(ENTER)": "Max gap"
    "&kp LG(LS(ENTER))": "Max full"

    # Focus (NAV middle row)
    "&kp LA(H)": "Focus ←"
    "&kp LA(J)": "Focus ↓"
    "&kp LA(K)": "Focus ↑"
    "&kp LA(L)": "Focus →"

    # BOARD (/ + End)
    "&rgb_ug RGB_TOG": RGB on/off
    "&rgb_ug RGB_EFF": Effect
    "&rgb_ug RGB_COLOR_HSB(0,0,100)": White
    "&rgb_ug RGB_BRI": "Bright +"
    "&rgb_ug RGB_BRD": "Bright −"
    "&rgb_ug RGB_HUI": "Hue +"
    "&rgb_ug RGB_HUD": "Hue −"
    "&rgb_ug RGB_SAI": "Sat +"
    "&rgb_ug RGB_SAD": "Sat −"
    "&bt BT_SEL 0": BT 1
    "&bt BT_SEL 1": BT 2
    "&bt BT_SEL 2": BT 3
    "&bt BT_SEL 3": BT 4
    "&bt BT_SEL 4": BT 5
    "&bt BT_CLR": Clear BT
    "&bt BT_CLR_ALL": Clear all BT

  # Labels by keycode (no Shift legends: they only add noise on the symbol layers)
  zmk_keycode_map:
    EXCL: "!"
    AT: "@"
    HASH: "#"
    DOLLAR: $
    PERCENT: "%"
    CARET: ^
    AMPS: "&"
    STAR: "*"
    LPAR: (
    RPAR: )
    EQUAL: "="
    PLUS: +
    MINUS: "-"
    UNDER: _
    FSLH: /
    QMARK: "?"
    BSLH: '\'
    PIPE: "|"
    SEMI: ;
    COLON: ":"
    SQT: "'"
    DQT: '"'
    LT: <
    GT: ">"
    DOT: .
    COMMA: ","
    LBKT: "["
    RBKT: "]"
    LBRC: "{"
    RBRC: "}"
    GRAVE: "`"
    TILDE: "~"
    N0: "0"
    N1: "1"
    N2: "2"
    N3: "3"
    N4: "4"
    N5: "5"
    N6: "6"
    N7: "7"
    N8: "8"
    N9: "9"

    LCTRL: Ctrl
    LALT: Alt
    LSHIFT: Shift
    LGUI: Super

    UP: "↑"
    DOWN: "↓"
    LEFT: "←"
    RIGHT: "→"
    PGUP: PgUp
    PGDN: PgDn
    HOME: Home
    END: End

    ENTER: {t: "$$mdi:keyboard-return$$", type: enter}
    ESC: Esc
    TAB: Tab
    SPACE: Space
    BSPC: {t: "$$mdi:backspace-outline$$", type: backspace}
    DEL: Del

    C_MUTE: $$mdi:volume-off$$
    C_VOL_UP: $$mdi:volume-high$$
    C_VOL_DN: $$mdi:volume-medium$$
    C_PP: $$mdi:play-pause$$
    C_NEXT: $$mdi:skip-next$$

  # Only Esc is drawn; layer combos already show as held (yellow) keys on their layer
  zmk_combos:
    combo_kj_esc:
      align: top
    combo_df_numpad:
      hidden: true
    combo_sdf_fn:
      hidden: true
    combo_cv_mov_win:
      hidden: true
    combo_slash_end_board:
      hidden: true
